<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>候補を確認する</title>
  <link rel="stylesheet" href="../src/styles/tokens.css">
  <link rel="stylesheet" href="../src/styles/base.css">
  <link rel="stylesheet" href="../src/styles/teacher.css?v=20260503b">
</head>
<body class="teacher-body">
  <main class="teacher-shell">
    <section class="teacher-card">
      <div class="teacher-headline">
        <div>
          <p class="teacher-eyebrow">STEP 2</p>
          <h1 class="teacher-title">候補を確認する</h1>
          <p class="teacher-sub">STEP1で取り込んだ譜面をここで確認します。まずは画像表示までをつなぎます。</p>
        </div>
        <span class="teacher-badge">v20260503b</span>
      </div>
    </section>

    <section class="teacher-card teacher-row" id="candidateEmpty" hidden>
      <p class="teacher-note">STEP1のデータがありません</p>
      <div class="teacher-flow">
        <div class="teacher-flow-item">先に「STEP 1 譜面を取り込む」で画像を選んでください。</div>
      </div>
      <div class="teacher-menu">
        <a class="teacher-link primary" href="./import-score.html">
          <span>STEP 1 へ進む</span>
          <span>→</span>
        </a>
        <a class="teacher-link subtle" href="./teacher.html">
          <span>メニューへ戻る</span>
          <span>←</span>
        </a>
      </div>
    </section>

    <section id="candidateContent" hidden>
      <section class="teacher-card teacher-row">
        <div class="teacher-pagebar">
          <p class="teacher-note">取り込みページ</p>
          <div class="teacher-page-tabs" id="pageTabs"></div>
        </div>
      </section>

      <section class="teacher-grid candidate-grid">
        <section class="teacher-card teacher-row">
          <p class="teacher-note">STEP1から引き継いだ画像</p>
          <div class="teacher-image-frame">
            <img id="candidateImage" alt="補正後譜面" />
          </div>
          <p class="teacher-image-caption" id="candidateCaption"></p>
        </section>

        <section class="teacher-card teacher-row">
          <div class="teacher-review-head">
            <p class="teacher-note">確認結果</p>
            <span class="teacher-review-badge" id="reviewBadge">未確認</span>
          </div>
          <div class="teacher-review-grid">
            <div class="teacher-review-item" data-review-key="lines">
              <div class="teacher-review-label">4線候補</div>
              <div class="teacher-review-actions">
                <button type="button" class="teacher-mini-btn" data-review-value="ok">OK</button>
                <button type="button" class="teacher-mini-btn" data-review-value="hold">保留</button>
                <button type="button" class="teacher-mini-btn" data-review-value="ng">違う</button>
              </div>
            </div>
            <div class="teacher-review-item" data-review-key="bars">
              <div class="teacher-review-label">小節候補</div>
              <div class="teacher-review-actions">
                <button type="button" class="teacher-mini-btn" data-review-value="ok">OK</button>
                <button type="button" class="teacher-mini-btn" data-review-value="hold">保留</button>
                <button type="button" class="teacher-mini-btn" data-review-value="ng">違う</button>
              </div>
            </div>
            <div class="teacher-review-item" data-review-key="digits">
              <div class="teacher-review-label">数字候補</div>
              <div class="teacher-review-actions">
                <button type="button" class="teacher-mini-btn" data-review-value="ok">OK</button>
                <button type="button" class="teacher-mini-btn" data-review-value="hold">保留</button>
                <button type="button" class="teacher-mini-btn" data-review-value="ng">違う</button>
              </div>
            </div>
            <div class="teacher-review-item" data-review-key="stroke">
              <div class="teacher-review-label">ストローク候補</div>
              <div class="teacher-review-actions">
                <button type="button" class="teacher-mini-btn" data-review-value="ok">OK</button>
                <button type="button" class="teacher-mini-btn" data-review-value="hold">保留</button>
                <button type="button" class="teacher-mini-btn" data-review-value="ng">違う</button>
              </div>
            </div>
          </div>
        </section>
      </section>

      <section class="teacher-card">
        <div class="teacher-menu">
          <a class="teacher-link primary" href="./import-score.html">
            <span>STEP 1 に戻る</span>
            <span>←</span>
          </a>
          <button class="teacher-btn subtle disabled" type="button" disabled>
            <span>STEP 3 人が確定する</span>
            <span>準備中</span>
          </button>
          <a class="teacher-link subtle" href="./teacher.html">
            <span>メニューへ戻る</span>
            <span>←</span>
          </a>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="../src/ui/teacher-screen.js?v=20260503b"></script>
</body>
</html>
